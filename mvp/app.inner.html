<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<title>ПроВожатый в MAX</title>

<!-- MAX Bridge: кладёт в window объект WebApp. Вне мессенджера скрипт
     не загрузится или не найдёт клиента — приложение уйдёт в демо-режим. -->
<script src="https://st.max.ru/js/max-web-app.js"></script>

<style>
/* ============================================================
   ПроВожатый — школьный контур «Заступника», мини-апп в MAX.
   Дизайн-токены 1:1 из зелёного контура «Заступник. Личный»
   (miniapp/src/theme/tokens.css) — единственный источник истины.
   Тема намеренно одна, светлая: бренд доминирует (см. AUDIT.md, P2).
   ============================================================ */
:root{
  color-scheme: light;

  --bg:#F1F4EE;            /* тёплый off-white фон */
  --surface:#FFFFFF;
  --tint:#EAF4E5;          /* светло-зелёная подложка иконок/чипов */
  --green:#63A64F;         /* фирменный зелёный (снят с логотипа) */
  --green-deep:#35722E;    /* тёмный зелёный: глубокие карточки, актив.таб */
  --green-soft:#9BD488;
  --green-deeper:#274F1E;
  --ink:#17231A;
  --muted:#63726A;
  --line:rgba(20,32,26,.08);
  --sos:#E13B37;           /* строго тревога. Больше нигде */
  --gold:#B0832A;
  --tint-gold:#FBF0DA;
  --r:20px;
  --shadow:0 12px 30px rgba(53,114,46,.10), 0 2px 6px rgba(53,114,46,.05);
  --green-rgb:99,166,79;

  /* пульт дежурного — тёмный контур надзора (слайды презентации) */
  --duty-bg:#14212B;
  --duty-surface:#1C2C38;
  --duty-line:rgba(255,255,255,.10);
  --duty-ink:#EAF1F0;
  --duty-muted:#8CA0A8;

  --display:'Manrope', system-ui, sans-serif;
  --body:'Golos Text', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, monospace;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:#E4E9E0;
  color:var(--ink);
  font-family:var(--body);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:var(--body);color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* ---------- демо-стенд ---------- */
.stand{
  height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;
  gap:10px;padding:10px 12px 14px;
}
/* Свёрнутый стенд — тонкая полоса, чтобы первым экраном был продукт,
   а не переключатель ролей. Развёрнутый остаётся прежним. */
.stand-toggle{
  width:100%;max-width:520px;flex:none;
  background:var(--duty-bg);color:var(--duty-muted);
  border:none;border-radius:999px;padding:9px 15px;
  display:flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:9.5px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;
  transition:color .18s;
}
.stand-toggle:hover{color:var(--duty-ink)}
.stand-toggle .st-dot{
  width:6px;height:6px;border-radius:50%;background:var(--green-soft);flex:none;
}
.stand-toggle .st-role{
  margin-left:auto;color:var(--green-soft);letter-spacing:.1em;
}
.stand-toggle .st-chev{transform:rotate(90deg);transition:transform .2s}
.stand-toggle[aria-expanded="true"] .st-chev{transform:rotate(-90deg)}
.standbar[hidden]{display:none}
.standbar{
  flex:none;
  width:100%;max-width:520px;
  background:var(--duty-bg);color:var(--duty-ink);
  border-radius:18px;padding:12px 14px;
  display:flex;flex-direction:column;gap:11px;
}
.standbar .sb-title{
  font-family:var(--mono);font-size:9.5px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--green-soft);
}
.standbar .sb-sub{font-size:11.5px;color:var(--duty-muted);line-height:1.4;margin-top:-5px}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  background:rgba(255,255,255,.06);padding:4px;border-radius:14px}
.roles button{
  background:none;border:none;color:var(--duty-muted);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 2px;border-radius:11px;font-size:10px;font-weight:500;line-height:1.15;
  text-align:center;transition:background .18s,color .18s;
}
.roles button svg{width:19px;height:19px}
.roles button[aria-pressed="true"]{background:var(--green);color:#fff;font-weight:600}
.sb-scen{display:flex;gap:6px;flex-wrap:wrap}
.sb-scen button{
  background:rgba(255,255,255,.07);border:1px solid var(--duty-line);color:var(--duty-ink);
  border-radius:11px;padding:7px 10px;font-size:11px;font-weight:500;
}
.sb-scen button:hover{background:rgba(255,255,255,.13)}

/* ---------- оболочка приложения ---------- */
.app{
  width:100%;max-width:440px;
  flex:1 1 auto;min-height:0;max-height:860px;
  background:var(--bg);
  border-radius:26px;
  box-shadow:0 24px 60px rgba(20,32,26,.18), 0 2px 0 rgba(255,255,255,.6) inset;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.app.dark{background:var(--duty-bg);color:var(--duty-ink)}

.hdr{
  padding:16px 18px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.hdr .logo{width:34px;height:34px;flex-shrink:0;object-fit:contain}
.wordmark{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.02em;line-height:1}
.wordmark small{
  display:block;font-family:var(--body);font-weight:500;font-size:9.5px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:3px;
}
.app.dark .wordmark small{color:var(--duty-muted)}
.hdr .grow{flex:1}
.status-chip{
  display:flex;align-items:center;gap:6px;background:var(--tint);color:var(--green-deep);
  font-size:11px;font-weight:600;padding:7px 11px;border-radius:20px;white-space:nowrap;
}
.status-chip.dark{background:rgba(255,255,255,.08);color:var(--green-soft)}
.status-chip.alert{background:#FBE3E2;color:var(--sos)}
.live{width:6px;height:6px;border-radius:50%;background:var(--green);animation:beat 2.4s infinite}
.live.red{background:var(--sos);animation:beat-red 1.4s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(var(--green-rgb),.5)}70%,100%{box-shadow:0 0 0 7px rgba(var(--green-rgb),0)}}
@keyframes beat-red{0%{box-shadow:0 0 0 0 rgba(225,59,55,.55)}70%,100%{box-shadow:0 0 0 8px rgba(225,59,55,0)}}

.screen{
  flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:4px 18px 22px;scrollbar-width:none;
}
.screen::-webkit-scrollbar{display:none}
.screen.anim>*{animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.nav{
  flex-shrink:0;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:9px 8px 11px;
}
.app.dark .nav{background:var(--duty-surface);border-top-color:var(--duty-line)}
.nav button{
  flex:1;background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:500;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;
}
.app.dark .nav button{color:var(--duty-muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--green-deep);font-weight:600}
.app.dark .nav button[aria-current="page"]{color:var(--green-soft)}

/* ---------- типографика ---------- */
.h1{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em;text-wrap:balance}
.h2{font-family:var(--display);font-weight:700;font-size:16.5px;text-wrap:balance}
.eyebrow{
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--green-deep);
}
.app.dark .eyebrow{color:var(--green-soft)}
.sub{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.app.dark .sub{color:var(--duty-muted)}
.sec{margin-top:20px}
.sec-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.sec-head .grow{flex:1}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.name{font-weight:600;font-size:14px;display:block}
.meta{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4;display:block}
.app.dark .meta{color:var(--duty-muted)}

/* ---------- карточки ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:15px;box-shadow:var(--shadow);
}
.app.dark .card{background:var(--duty-surface);border-color:var(--duty-line);box-shadow:none}
.card+.card{margin-top:11px}
.card.flat{box-shadow:none;background:transparent;border-style:dashed}
.card.deep{
  background:linear-gradient(140deg,var(--green-deep),var(--green-deeper));
  color:#fff;border:none;
}
.card.deep .meta,.card.deep .sub{color:rgba(255,255,255,.72)}
.card.alarm{border-color:rgba(225,59,55,.28);background:#FFF6F5}
.stack{display:flex;flex-direction:column;gap:11px}
.row{display:flex;align-items:center;gap:11px}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}

.avatar{
  width:42px;height:42px;border-radius:50%;background:var(--tint);color:var(--green-deep);
  display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex-shrink:0;
}
.avatar.sm{width:32px;height:32px;font-size:12px}
.avatar.gold{background:var(--tint-gold);color:var(--gold)}
.app.dark .avatar{background:rgba(255,255,255,.08);color:var(--green-soft)}

.ic-box{
  width:34px;height:34px;border-radius:11px;background:var(--tint);color:var(--green-deep);
  display:grid;place-items:center;flex-shrink:0;
}
.ic-box svg{width:18px;height:18px}
.ic-box.warn{background:var(--tint-gold);color:var(--gold)}
.ic-box.sos{background:#FBE3E2;color:var(--sos)}
.app.dark .ic-box{background:rgba(255,255,255,.08);color:var(--green-soft)}
.app.dark .ic-box.sos{background:rgba(225,59,55,.16);color:#FF8B87}

.pill{
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.04em;
  padding:5px 9px;border-radius:20px;white-space:nowrap;background:var(--tint);color:var(--green-deep);
}
.pill.warn{background:var(--tint-gold);color:var(--gold)}
.pill.sos{background:#FBE3E2;color:var(--sos)}
.pill.mute{background:rgba(20,32,26,.06);color:var(--muted)}
.app.dark .pill{background:rgba(155,212,136,.16);color:var(--green-soft)}
.app.dark .pill.sos{background:rgba(225,59,55,.18);color:#FF8B87}
.app.dark .pill.mute{background:rgba(255,255,255,.08);color:var(--duty-muted)}

/* ---------- кнопки ---------- */
.btn{
  width:100%;padding:15px;border:none;border-radius:16px;
  font-family:var(--display);font-weight:700;font-size:14.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s, filter .18s;
}
.btn:active{transform:scale(.985)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--green);color:#fff}
.btn.dark{background:var(--green-deep);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.app.dark .btn.ghost{background:rgba(255,255,255,.07);color:var(--duty-ink);border-color:var(--duty-line)}
.btn.danger{background:var(--sos);color:#fff;box-shadow:0 10px 24px rgba(225,59,55,.24)}
.btn.sm{padding:11px;font-size:13px;border-radius:13px}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;gap:9px;margin-top:11px}
.link{
  background:none;border:none;color:var(--green-deep);font-weight:600;font-size:12.5px;
  padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;
}
.app.dark .link{color:var(--green-soft)}
.back{
  display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);
  font-size:12.5px;font-weight:500;padding:6px 0;margin-bottom:2px;
}
.back svg{width:16px;height:16px}
.app.dark .back{color:var(--duty-muted)}

/* ---------- список-строки ---------- */
.group{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  overflow:hidden;box-shadow:var(--shadow);
}
.app.dark .group{background:var(--duty-surface);border-color:var(--duty-line);box-shadow:none}
.lrow{
  display:flex;align-items:center;gap:12px;padding:13px 15px;width:100%;
  background:none;border:none;border-bottom:1px solid var(--line);text-align:left;color:inherit;
}
.app.dark .lrow{border-bottom-color:var(--duty-line)}
.lrow:last-child{border-bottom:none}
.lrow .chev{color:var(--muted);display:grid;place-items:center;flex-shrink:0}
.lrow .chev svg{width:17px;height:17px}

/* ---------- чипы ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface);
  border:1px solid var(--line);border-radius:13px;padding:8px 12px;
  font-size:12.5px;font-weight:500;box-shadow:var(--shadow);color:var(--ink);
}
.chip svg{width:15px;height:15px}
.chip[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.app.dark .chip{background:rgba(255,255,255,.07);border-color:var(--duty-line);color:var(--duty-ink);box-shadow:none}

/* ---------- лестница доверия ---------- */
.tmeter{display:flex;gap:4px;margin-top:12px}
.tmeter i{flex:1;height:5px;border-radius:3px;background:rgba(20,32,26,.10)}
.tmeter i.on{background:var(--green)}
.tmeter i.gate{background:var(--gold)}
.tlev{display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border-bottom:1px solid var(--line)}
.tlev:last-child{border-bottom:none}
.tlev .tn{
  width:27px;height:27px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:rgba(20,32,26,.06);color:var(--muted);
  font-family:var(--mono);font-size:11px;font-weight:700;
}
.tlev .tn svg{width:15px;height:15px}
.tlev.done .tn{background:var(--green);color:#fff}
.tlev.now .tn{background:var(--tint-gold);color:var(--gold)}
.tlev .tq{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45;display:block}
.tlev .thow{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45;display:block;
  padding-left:9px;border-left:2px solid var(--line)}
.tlev .tcost{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--muted);
  text-transform:uppercase;white-space:nowrap}
.tbadge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
  font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 8px;border-radius:8px;background:var(--tint);color:var(--green-deep)}
.tbadge svg{width:12px;height:12px}
.tbadge.warn{background:var(--tint-gold);color:var(--gold)}
.tbadge.mute{background:rgba(20,32,26,.06);color:var(--muted)}
.app.dark .tbadge{background:rgba(255,255,255,.08);color:var(--green-soft)}

/* ---------- дни покрытия ---------- */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}
.day{
  border:1px solid var(--line);border-radius:13px;padding:9px 4px;text-align:center;
  background:var(--surface);
}
.day .d-l{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.day .d-v{font-size:10.5px;font-weight:600;margin-top:5px;line-height:1.2}
.day.ok{background:var(--tint);border-color:transparent}
.day.ok .d-v{color:var(--green-deep)}
.day.gap{background:#FFF6F5;border-color:rgba(225,59,55,.22)}
.day.gap .d-v{color:var(--sos)}

/* ---------- рельса состояний ---------- */
.rail{margin:14px -15px 4px;padding:0 15px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-track{display:flex;min-width:max-content;padding-bottom:2px}
.rail-item{width:82px;flex-shrink:0;position:relative;padding-top:16px}
.rail-item::before{
  content:'';position:absolute;top:5px;left:0;right:0;height:2px;background:rgba(20,32,26,.10);
}
.rail-item:first-child::before{left:50%}
.rail-item:last-child::before{right:50%}
.rail-item .dot{
  position:absolute;top:1px;left:calc(50% - 5px);width:10px;height:10px;border-radius:50%;
  background:#fff;border:2px solid rgba(20,32,26,.18);
}
.rail-item .lbl{font-size:9.5px;line-height:1.25;color:var(--muted);text-align:center;padding:0 3px}
.rail-item.done::before{background:var(--green-soft)}
.rail-item.done .dot{background:var(--green);border-color:var(--green)}
.rail-item.done .lbl{color:var(--green-deep)}
.rail-item.now .dot{
  background:var(--green);border-color:var(--green);
  box-shadow:0 0 0 0 rgba(var(--green-rgb),.55);animation:beat 2s infinite;
}
.rail-item.now .lbl{color:var(--ink);font-weight:700}
.app.dark .rail-item .lbl{color:var(--duty-muted)}
.app.dark .rail-item.now .lbl{color:var(--duty-ink)}
.app.dark .rail-item .dot{background:var(--duty-surface);border-color:rgba(255,255,255,.22)}

/* ---------- карта ---------- */
.map{
  position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);
  background:#EDF1E9;
}
.map svg{display:block;width:100%;height:auto}
.map-badge{
  position:absolute;left:10px;top:10px;background:rgba(255,255,255,.94);
  border-radius:11px;padding:6px 10px;font-size:10.5px;font-weight:600;
  display:flex;align-items:center;gap:6px;box-shadow:0 2px 10px rgba(20,32,26,.12);
}
.map-foot{
  display:flex;gap:10px;padding:10px 12px;background:var(--surface);
  border-top:1px solid var(--line);font-size:11px;color:var(--muted);align-items:center;
}
.walker{transition:transform .9s linear}
@keyframes ping{0%{r:7;opacity:.55}100%{r:17;opacity:0}}
.ping{animation:ping 2.2s infinite}

/* ---------- таблица «Информация» ---------- */
.kv{border-top:1px solid var(--line);margin-top:12px}
.kv .kv-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.app.dark .kv,.app.dark .kv .kv-row{border-color:var(--duty-line)}
.kv .k{color:var(--muted);flex:1}
.kv .v{font-weight:600;text-align:right}

/* ---------- журнал ---------- */
.log{display:flex;flex-direction:column;gap:0;margin-top:4px}
.log-item{display:flex;gap:11px;padding:8px 0}
.log-item .t{font-family:var(--mono);font-size:10.5px;color:var(--muted);width:44px;flex-shrink:0;padding-top:1px}
.log-item .b{font-size:12.5px;line-height:1.4}
.log-item .b em{font-style:normal;color:var(--muted);font-size:11.5px;display:block;margin-top:1px}
.app.dark .log-item .b em{color:var(--duty-muted)}

/* ---------- шаги мастера ---------- */
.stepper{display:flex;gap:5px;margin:12px 0 16px}
.stepper i{flex:1;height:4px;border-radius:3px;background:rgba(20,32,26,.10)}
.stepper i.on{background:var(--green)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:13px;
  background:var(--surface);font-family:var(--body);font-size:14px;color:var(--ink);
}
.field input:focus-visible{outline:2px solid var(--green);border-color:var(--green)}
.opt{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px 13px;margin-bottom:8px;color:inherit;
}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--tint)}
.opt .mark{
  width:20px;height:20px;border-radius:50%;border:2px solid rgba(20,32,26,.18);flex-shrink:0;
  display:grid;place-items:center;color:#fff;
}
.opt[aria-pressed="true"] .mark{background:var(--green);border-color:var(--green)}
.opt .mark svg{width:12px;height:12px}

/* ---------- нижний лист ---------- */
.sheet-back{
  position:absolute;inset:0;background:rgba(20,32,26,.42);z-index:60;
  display:flex;align-items:flex-end;animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;background:var(--bg);border-radius:24px 24px 0 0;padding:18px;
  max-height:86%;overflow-y:auto;animation:up .26s cubic-bezier(.2,.8,.3,1);
}
.app.dark .sheet{background:var(--duty-bg)}
@keyframes up{from{transform:translateY(28px)}to{transform:none}}
.sheet .handle{width:38px;height:4px;border-radius:3px;background:rgba(20,32,26,.16);margin:-6px auto 14px}

/* ---------- подстраница ---------- */
.page-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.page-head .h1{flex:1;font-size:19px}
.footer-cta{
  flex-shrink:0;padding:10px 18px 14px;
  background:linear-gradient(180deg,rgba(241,244,238,0),var(--bg) 42%);
}
.app.dark .footer-cta{background:linear-gradient(180deg,rgba(20,33,43,0),var(--duty-bg) 42%)}

/* ---------- тост ---------- */
.toast{
  position:absolute;left:18px;right:18px;bottom:88px;z-index:80;
  background:var(--ink);color:#fff;border-radius:15px;padding:13px 15px;font-size:12.5px;
  box-shadow:0 14px 34px rgba(20,32,26,.3);animation:up .24s ease;line-height:1.4;
}
.toast b{font-weight:600}

/* ---------- сообщение MAX ---------- */
.max-msg{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:12px 13px;box-shadow:var(--shadow);position:relative;
}
.max-msg .mm-head{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.max-msg .mm-badge{
  font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.14em;
  background:var(--ink);color:#fff;border-radius:5px;padding:3px 5px;
}
.max-msg .mm-time{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
.max-msg .mm-body{font-size:13px;line-height:1.45}

/* ---------- служебное ---------- */
.empty{text-align:center;padding:26px 18px}
.empty svg{width:56px;height:56px;color:var(--green-soft);margin-bottom:10px}
.note{
  font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px;
  padding-left:11px;border-left:2px solid var(--line);
}
.app.dark .note{color:var(--duty-muted);border-left-color:var(--duty-line)}
.photo-slot{
  border:1.5px dashed rgba(20,32,26,.18);border-radius:15px;padding:18px;text-align:center;
  background:var(--surface);
}
.photo-slot img{width:100%;max-height:150px;object-fit:cover;border-radius:11px;display:block}
.hint{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.45}

@media (max-width:520px){
  .stand{padding:8px 0 0;gap:8px}
  .standbar{border-radius:0;max-width:none;padding:10px 12px}
  .app{max-width:none;border-radius:0;box-shadow:none}
}

<script>
/* ============================================================
   ПроВожатый — прототип мини-приложения MAX. Всё на моках.
   Одно состояние (DB) на четыре роли: действие сопровождающего
   немедленно видно родителю и дежурному.
   ============================================================ */

/* ---------- конфигурация публикации -------------------------
   Имя бота, к которому привязано мини-приложение. Мини-апп в MAX
   не существует сам по себе — он всегда открывается из бота.
------------------------------------------------------------- */
const BOT_NAME = 'provozhatiy';
const DEEPLINK = 'https://max.ru/' + BOT_NAME;

/* ---------- слой MAX ----------------------------------------
   Единственное место, где продукт касается мессенджера.
   Surface сверен с dev.max.ru/docs/webapps/bridge: библиотека
   max-web-app.js кладёт в window объект WebApp и не требует
   инициализации — ни ready(), ни expand() у MAX нет.
   Вне MAX объекта нет, и приложение работает в демо-режиме.
------------------------------------------------------------- */
const maxBridge = (() => {
  // Библиотека создаёт window.WebApp даже в обычном браузере — наличие объекта
  // ещё не значит, что за ним есть клиент MAX. Признак живого клиента —
  // заполненный platform: вне мессенджера он null.
  const wa = window.WebApp && window.WebApp.platform ? window.WebApp : null;
  const call = (fn) => { try { return fn(); } catch (e) { return undefined; } };
  return {
    inMax: !!wa,
    platform: wa && wa.platform || 'web',

    // Подписанная строка запуска. Доверять ей можно только после проверки
    // на бэкенде: HMAC_SHA256(HMAC_SHA256('WebAppData', botToken), параметры).
    // initDataUnsafe ниже — для отрисовки, не для авторизации.
    initData: wa && wa.initData || '',

    user() {
      const u = wa && wa.initDataUnsafe && wa.initDataUnsafe.user;
      if (!u) return { id: 'demo', name: DB.parent.name, photo: '' };
      return { id: u.id, name: [u.first_name, u.last_name].filter(Boolean).join(' '), photo: u.photo_url || '' };
    },
    // Чат, из которого открыли мини-апп: для координатора это и есть чат класса.
    chat() { return wa && wa.initDataUnsafe && wa.initDataUnsafe.chat || null; },
    startParam() {
      const p = wa && wa.initDataUnsafe && wa.initDataUnsafe.start_param;
      return p || new URLSearchParams(location.search).get('WebAppStartParam') || '';
    },

    haptic(style) { call(() => wa.HapticFeedback.impactOccurred(style || 'light')); },
    notify(type) { call(() => wa.HapticFeedback.notificationOccurred(type)); },

    share(text, link) {
      if (!wa || !wa.shareMaxContent) return false;
      call(() => wa.shareMaxContent(link ? { text, link } : { text }));
      return true;
    },

    /* --- поверхности верификации ---------------------------------
       Всё, что MAX реально даёт для ответа на вопрос «кто этот человек».
       Каждый метод возвращает Promise либо null, если мы не в мессенджере, —
       вызывающий код сам решает, что показать в демо-режиме. */

    // Номер телефона, привязанный к аккаунту MAX. Нативное модальное окно.
    // Ответ {phone, authDate, hash} проверяется на сервере:
    // HMAC_SHA256(authDate + phone + userId, botToken), phone без «+».
    // Это же — законный способ авторизации по ч.10 ст.8 149-ФЗ.
    requestPhone() { return wa && wa.requestContact ? wa.requestContact() : null; },

    // Биометрия устройства: подтверждает, что телефоном пользуется владелец.
    // Не заменяет документы — отвечает на другой вопрос: «он ли это сейчас».
    biometry: {
      init() { return wa && wa.BiometricManager ? call(() => wa.BiometricManager.init()) : null; },
      auth(reason) { return wa && wa.BiometricManager ? call(() => wa.BiometricManager.authenticate(reason)) : null; },
    },

    // QR: подтверждение передачи ребёнка встречающему. Сильнее фото —
    // код живёт на экране принимающего и подтверждает присутствие.
    scanQR() { return wa && wa.openCodeReader ? call(() => wa.openCodeReader(false)) : null; },

    // Внешний браузер — сюда уходит ЕСИА и заказ справки на Госуслугах.
    openLink(url) { if (wa && wa.openLink) { call(() => wa.openLink(url)); return true; } return false; },
    // Диплинк внутрь MAX или в нативный «Заступник».
    openMaxLink(url) { if (wa && wa.openMaxLink) { call(() => wa.openMaxLink(url)); return true; } return false; },

    // Экраны с данными ребёнка не должны утекать скриншотом.
    screenshots(on) { call(() => (on ? wa.ScreenCapture.enableScreenCapture() : wa.ScreenCapture.disableScreenCapture())); },

    // В MAX нет кнопки «назад» браузера — её рисует сам мессенджер.
    back: {
      onClick(cb) { call(() => wa.BackButton.onClick(cb)); },
      show() { call(() => wa.BackButton.show()); },
      hide() { call(() => wa.BackButton.hide()); },
    },
    guardClosing(on) { call(() => (on ? wa.enableClosingConfirmation() : wa.disableClosingConfirmation())); },
  };
})();

/* ---------- утилиты ---------- */
const $ = (s) => document.querySelector(s);
const ic = (n, s = 18) => '<svg style="width:' + s + 'px;height:' + s + 'px;flex:none" aria-hidden="true"><use href="#i-' + n + '"></use></svg>';
const pad = (n) => String(n).padStart(2, '0');
const fmtHM = (sec) => pad(Math.floor(sec / 3600) % 24) + ':' + pad(Math.floor(sec / 60) % 60);

const DEMO_START = Date.now();
const CLOCK_BASE = 8 * 3600 + 41 * 60; // демо-время старта прототипа — 08:41
const tclock = () => fmtHM(CLOCK_BASE + Math.floor((Date.now() - DEMO_START) / 1000));

const DAYS = [['mon', 'ПН'], ['tue', 'ВТ'], ['wed', 'СР'], ['thu', 'ЧТ'], ['fri', 'ПТ']];
const DAY_FULL = { mon: 'Понедельник', tue: 'Вторник', wed: 'Среда', thu: 'Четверг', fri: 'Пятница' };
/* винительный падеж: «подбор на пятницу», а не «на пятница» */
const DAY_ACC = { mon: 'понедельник', tue: 'вторник', wed: 'среду', thu: 'четверг', fri: 'пятницу' };
const plural = (n, one, few, many) => {
  const a = Math.abs(n) % 100, b = a % 10;
  return n + ' ' + (a > 10 && a < 20 ? many : b === 1 ? one : b > 1 && b < 5 ? few : many);
};

const STAGES = [
  'Ожидается', 'Едет к точке встречи', 'На месте встречи', 'Ребёнок со мной',
  'В пути', 'На месте назначения', 'Передача ребёнка', 'Передача подтверждена', 'Завершено',
];
/* формулировки для родителя: этап словами, а не кодом состояния */
const STAGE_PARENT = [
  ['Сопровождение сегодня в 08:30', 'Алина подтвердила задание вчера вечером'],
  ['Алина идёт к точке встречи', 'Точка встречи — подъезд, Малая Филёвская, 04'],
  ['Алина на месте встречи', 'Ждёт Мишу у подъезда'],
  ['Миша с сопровождающим', 'Встретились, выходят на маршрут'],
  ['Миша в пути', 'Идут по маршруту дом → Школа №1'],
  ['Пришли к школе', 'На месте назначения, впереди передача'],
  ['Передача ребёнка', 'Алина передаёт Мишу дежурному по вахте'],
  ['Миша дошёл', 'Передача подтверждена фото'],
  ['Миша дошёл', 'Поездка завершена'],
];

/* ---------- данные ---------- */
/* ---------- лестница доверия --------------------------------------
   Верификация — то единственное, что мини-апп делает лучше нативного
   приложения: он живёт внутри мессенджера, где у человека уже есть
   подтверждённый российский номер. Уровни независимы, но порядок не
   случаен — каждый следующий дороже предыдущего и отвечает на свой
   вопрос. «Проверен» без указания уровня — это не факт, а обещание.
-------------------------------------------------------------------- */
const TRUST = [
  { id: 'max', icon: 'chat', name: 'Аккаунт MAX',
    q: 'Есть ли за экраном живой аккаунт',
    how: 'Подпись initData сверяется на сервере с токеном бота',
    cost: 'мгновенно' },
  { id: 'phone', icon: 'phone', name: 'Номер телефона',
    q: 'Чей это номер и куда звонить',

/* ---------- геометрия маршрута (замеряется в скрытом SVG) ---------- */
const ROUTE_D = 'M44 158 L44 118 L120 118 L120 66 L248 66 L248 40';
const APPR_D = 'M16 178 L44 178 L44 158';
let mRoute, mAppr;
(function measureInit() {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', '0'); svg.setAttribute('height', '0');
  svg.style.cssText = 'position:absolute;visibility:hidden';
  mRoute = document.createElementNS(NS, 'path'); mRoute.setAttribute('d', ROUTE_D);
  mAppr = document.createElementNS(NS, 'path'); mAppr.setAttribute('d', APPR_D);
  svg.append(mRoute, mAppr);
  document.body.appendChild(svg);
})();
function walkerPos(t) {
  const p = t.stage <= 2 ? mAppr : mRoute;
  const f = t.stage <= 2 ? t.approach : t.progress;
  const pt = p.getPointAtLength(p.getTotalLength() * Math.max(0, Math.min(1, f)));
  return { x: pt.x, y: pt.y };
}

/* ---------- компоненты ---------- */
function rail(stage) {
  return '<div class="rail"><div class="rail-track">' + STAGES.map((s, i) => {
    const cls = i < stage ? 'done' : i === stage ? 'now' : '';
    return '<div class="rail-item ' + cls + '"><span class="dot"></span><span class="lbl">' + s + '</span></div>';
  }).join('') + '</div></div>';
}

function mapBlock(t, big) {
  const p = walkerPos(t);
  const h = big ? '' : ' style="max-height:150px"';
  const doneMain = t.stage >= 3 ? (t.stage >= 5 ? 1 : t.progress) : 0;
  const len = mRoute.getTotalLength();
  return '' +
    '<div class="map">' +
      '<svg viewBox="0 0 320 190"' + h + ' role="img" aria-label="Схема маршрута дом — школа">' +
        '<rect width="320" height="190" fill="#EDF1E9"/>' +
        '<rect x="10" y="112" width="88" height="70" rx="10" fill="#DCEBD2"/>' +
        '<rect x="196" y="96" width="112" height="58" rx="10" fill="#E5EAE1"/>' +
        '<g stroke="#E1E7DC" stroke-width="10" stroke-linecap="round">' +
          '<path d="M0 66h320"/><path d="M0 118h320"/><path d="M44 0v190"/><path d="M248 0v190"/>' +
        '</g>' +
        '<path d="' + APPR_D + '" fill="none" stroke="#9BD488" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round"/>' +
        '<path d="' + ROUTE_D + '" fill="none" stroke="rgba(53,114,46,.22)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<path d="' + ROUTE_D + '" fill="none" stroke="#35722E" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" ' +
          'stroke-dasharray="' + len + '" stroke-dashoffset="' + (len * (1 - doneMain)) + '"/>' +
        '<g><circle cx="44" cy="158" r="8" fill="#fff"/><circle cx="44" cy="158" r="4.6" fill="#63A64F"/></g>' +
        '<g><circle cx="248" cy="40" r="8" fill="#fff"/><circle cx="248" cy="40" r="4.6" fill="#35722E"/></g>' +
        '<text x="44" y="176" text-anchor="middle" font-family="Golos Text,sans-serif" font-size="8.5" fill="#63726A">Дом</text>' +
        '<text x="248" y="26" text-anchor="middle" font-family="Golos Text,sans-serif" font-size="8.5" fill="#63726A">Школа №1</text>' +
        (t.done ? '' :
          '<g class="walker" transform="translate(' + p.x + ',' + p.y + ')">' +
            (t.frozen ? '' : '<circle r="7" fill="rgba(99,166,79,.35)" class="ping"/>') +
            '<circle r="7" fill="#fff"/>' +
            '<circle r="4.4" fill="' + (t.frozen ? '#B0832A' : '#63A64F') + '"/>' +
          '</g>') +
      '</svg>' +
      '<div class="map-badge">' + ic(t.frozen ? 'signal' : 'walk', 14) + STAGES[t.stage] + '</div>' +
    '</div>';
}

function fixLine(t) {
  const age = Math.floor((Date.now() - t.fixAt) / 1000);
  if (t.frozen && age > 20) {
    return '<div class="map-foot" style="background:#FFF6F5;border-color:rgba(225,59,55,.2);color:var(--sos)">' +
      ic('signal', 15) + '<span><b>Сигнал не поступает ' + age + ' сек.</b> Мы не показываем старую метку как свежую — дежурный уже видит это.</span></div>';
  }
  return '<div class="map-foot">' + ic('loc', 15) +
    '<span class="mono">получено ' + Math.max(1, age) + ' сек назад · точность ~8 м</span></div>';
}

function toast(text, ms) {
  const root = $('#toast-root');
  root.innerHTML = '<div class="toast">' + text + '</div>';
  clearTimeout(toast._t);

function attention() {
  const out = [];
  const t = DB.trip;
  if (t && !t.done && t.frozen && Date.now() - t.fixAt > 20000) {
    out.push({ icon: 'signal', tone: 'sos', title: 'Сигнал сопровождающего не поступает',
      sub: 'Дежурный «Заступника» уже разбирается — поездка на контроле', act: 'go-track' });
  }
  DB.routes.forEach((r) => {
    r.days.forEach((d) => {
      if (!r.cover[d]) out.push({ icon: 'alarm', tone: 'warn',
        title: DAY_FULL[d] + ' · ' + r.title + ' без сопровождающего',
        sub: 'В этот день поездки не будет, пока вы не подберёте человека', act: 'match', p: { r: r.id, d } });
    });
  });
  if (DB.pending) {
    const c = DB.people[DB.pending.id];
    out.push({ icon: 'users', tone: '', title: 'Ожидает вашего одобрения',
      sub: c.name + ' предложен на ' + DAY_ACC[DB.pending.day] + ', маршрут «Школа №1 → Дом»',
      act: 'match', p: { r: DB.pending.routeId, d: DB.pending.day } });

      sub: DB.firstWalk.who + ' · вы идёте маршрут вместе и решаете, доверять ли дальше', act: 'noop' });

  return out;
}

/* ---------- проверка личности --------------------------------------
   Главный экран мини-аппа: в MAX человек уже сидит с подтверждённым
   номером, и дешевле всего проверять его здесь. Геотрекинг остаётся
   нативному «Заступнику» — сюда он не переезжает.
--------------------------------------------------------------------- */
const TRUST_CTA = {
  phone: ['Подтвердить номер', 'verify-phone'],
  person: ['Войти через Госуслуги', 'verify-person'],
  crim: ['Заказать справку', 'verify-crim'],
  local: ['Напомнить координатору', 'verify-local'],
  live: ['Включить биометрию', 'verify-live'],
};

function trustBadge(p) {
  const n = trustCount(p);
  if (trustOk(p)) return '<span class="tbadge">' + ic('shield', 12) + n + ' из ' + TRUST.length + '</span>';
  return '<span class="tbadge warn">' + ic('info', 12) + n + ' из ' + TRUST.length + '</span>';
}

/* Чипы уровней: пройденные — зелёной галочкой, недостающие показываем
   тем же списком серым. Пустота на месте уровня информативнее, чем его
   отсутствие в перечне: родитель видит, чего именно не хватает. */
function trustChips(p) {
  return '<div class="chips" style="margin-top:10px">' + TRUST.filter((t) => t.id !== 'live').map((t) => {
    const ok = trustHas(p, t.id);
    return '<span class="chip" style="box-shadow:none;padding:6px 9px;font-size:11px' +
      (ok ? '' : ';opacity:.45;border-style:dashed') + '">' +
      ic(ok ? 'check' : 'close', 13) + t.name + '</span>';
  }).join('') + '</div>';
}

function trustMeter(p) {
  return '<div class="tmeter">' + TRUST.map((t) =>
    '<i class="' + (trustHas(p, t.id) ? (t.id === ESCORT_GATE ? 'on gate' : 'on') : '') + '"></i>').join('') + '</div>';
}

P.verify = () => {
  const me = meNow();
  const done = trustCount(me);
  const next = TRUST.find((t) => !trustHas(me, t.id));
  return backHead('Проверка личности') +
    '<p class="sub">Родителю нужен ответ не «проверен», а <b>чем именно</b>. Каждый уровень отвечает на свой вопрос и стоит своего времени.</p>' +
    '<div class="card" style="margin-top:14px">' +
      '<div class="row"><span class="grow"><span class="name">Пройдено ' + done + ' из ' + TRUST.length + '</span>' +
      '<span class="meta">' + (trustOk(me)
        ? 'Достаточно, чтобы вести чужого ребёнка.'
        : 'Чтобы вести чужого ребёнка, нужен уровень «' + TRUST_BY[ESCORT_GATE].name + '».') + '</span></span>' +
      trustBadge(me) + '</div>' + trustMeter(me) +
    '</div>' +
    '<div class="sec"><div class="group">' +
    TRUST.map((t) => {
      const ok = trustHas(me, t.id);
      const isNext = next && next.id === t.id;
      const cta = TRUST_CTA[t.id];
      return '<div class="tlev ' + (ok ? 'done' : isNext ? 'now' : '') + '">' +
        '<span class="tn">' + (ok ? ic('check', 15) : String(t.n + 1)) + '</span>' +
        '<span class="grow">' +
          '<span class="row" style="gap:8px"><span class="name grow">' + t.name + '</span>' +
          (ok ? '<span class="tbadge">' + ic('check', 12) + 'есть</span>'
              : '<span class="tcost">' + t.cost + '</span>') + '</span>' +
          '<span class="tq">' + t.q + '</span>' +
          '<span class="thow">' + t.how + '</span>' +
          (!ok && cta ? '<button class="btn ghost sm" style="margin-top:10px" data-act="' + cta[1] + '">' + cta[0] + '</button>' : '') +
        '</span></div>';
    }).join('') +
    '</div></div>' +
    '<div class="sec"><div class="sec-head"><span class="h2 grow">Что открывает уровень</span></div>' +
    '<div class="group">' +
      '<div class="lrow"><span class="ic-box">' + ic('eye', 18) + '</span><span class="grow"><span class="name">Смотреть и получать уведомления</span>' +
      '<span class="meta">Аккаунт MAX</span></span></div>' +
      '<div class="lrow"><span class="ic-box">' + ic('route', 18) + '</span><span class="grow"><span class="name">Заказать сопровождение своему ребёнку</span>' +
      '<span class="meta">Номер телефона + личность</span></span></div>' +
      '<div class="lrow"><span class="ic-box ' + (trustOk(me) ? '' : 'warn') + '">' + ic('walk', 18) + '</span><span class="grow"><span class="name">Вести чужого ребёнка</span>' +
      '<span class="meta">Несудимость и подтверждение школы</span></span>' +
      (trustOk(me) ? '<span class="pill">открыто</span>' : '<span class="pill warn">закрыто</span>') + '</div>' +
    '</div></div>' +
    '<p class="note">Уровни хранятся на сервере, а не в приложении: подпись запуска, хеш номера и справку проверяет бэкенд. Клиент только показывает результат — иначе «проверку» можно было бы нарисовать себе самому.</p>';

      '<p class="note">Роль принимающего должна совпадать с типом передачи. Чужой не получит ребёнка даже с фото.</p>';
  } else if (w.step === 4) {
    body = opt('Только из нашей школы', true) + opt('Возраст от 16 лет', false) + opt('Пройден модуль «Первая помощь»', false);
  } else {
    body = '<div class="card"><div class="kv" style="border-top:none">' +
      kv('Ребёнок', w.child) + kv('Откуда', w.from) + kv('Куда', w.to || 'не выбрано') +
      kv('Дни', w.days.map((d) => DAYS.find((x) => x[0] === d)[1]).join(', ')) + kv('Время', w.time) +
      kv('Принимают', w.wl.length ? w.wl.length + ' человека' : 'не выбрано') + '</div></div>' +
      '<p class="note">Черновик сохраняется: можно закрыть мини-апп и вернуться позже.</p>';
  }
  const last = w.step === steps.length - 1;
  const blocked = (w.step === 1 && !w.to) || (w.step === 3 && !w.wl.length);
  return '<button class="back" data-act="' + (w.step ? 'wiz-back' : 'pop') + '">' + ic('back', 16) + 'Назад</button>' +
    '<div class="row" style="margin-top:2px"><span class="grow"></span><span class="mono" style="font-size:11px;color:var(--muted)">' + (w.step + 1) + ' из ' + steps.length + '</span></div>' +
    '<div class="stepper">' + steps.map((_, i) => '<i class="' + (i <= w.step ? 'on' : '') + '"></i>').join('') + '</div>' +
    '<div class="h1" style="font-size:19px">' + st.t + '</div><p class="sub" style="margin-bottom:16px">' + st.s + '</p>' +
    body +
    '<button class="btn primary" style="margin-top:16px" data-act="wiz-next"' + (blocked ? ' disabled' : '') + '>' +
      (last ? 'Создать маршрут' : 'Далее') + '</button>';
};

    (act ? ' data-act="' + act + '" data-v="' + val + '"' : ' data-act="noop"') + '>' +
    '<span class="mark">' + ic('check', 12) + '</span><span class="grow"><span class="name">' + label + '</span></span></button>';

    ['Опасность мне', 'Угроза вам как сопровождающему', 'danger'],
    ['Ребёнку плохо, я растерялся', 'Нужен дежурный: подскажет, что делать', 'ghost'],
  ];
  return '<div class="h2">Что случилось?</div>' +
    '<p class="sub" style="margin-bottom:14px">Тревога откроется немедленно. При угрозе жизни сразу звоните 112.</p>' +
    opts.map((o) => '<button class="btn ' + o[2] + '" style="margin-bottom:9px" data-act="sos-pick" data-v="' + o[0] + '">' + o[0] + '</button>' +
      '<p class="meta" style="margin:-4px 0 12px 2px">' + o[1] + '</p>').join('') +
    '<button class="btn ghost sm" data-act="sheet-back">Закрыть</button>' +
    '<p class="note">У четырнадцатилетнего порог «это ЧП» другой: дежурный получает первый факт, случайное нажатие тормозится, а «упал в лужу» уходит туда, где семью не пугают.</p>';
}

function chatSheet() {
  return '<div class="h2">Чат поездки</div>' +
    '<p class="sub" style="margin-bottom:12px">Хранится внутри сервиса — чтобы поддержка могла разобрать спорную ситуацию.</p>' +
    '<div class="card"><div class="log">' +
      '<div class="log-item"><span class="t">08:29</span><span class="b">Мы у подъезда, выходим<em>Алина Кузнецова</em></span></div>' +
      '<div class="log-item"><span class="t">08:30</span><span class="b">Спасибо! Шапка в рюкзаке<em>Ольга Соколова</em></span></div>' +
      '<div class="log-item"><span class="t">08:41</span><span class="b">Прошли Новозаводскую, идём по графику<em>Алина Кузнецова</em></span></div>' +
    '</div></div>' +
    '<div class="field" style="margin-top:12px"><input placeholder="Сообщение" data-in="chat"></div>' +
    '<button class="btn primary" data-act="toast" data-msg="Сообщение отправлено в чат поездки.">' + ic('send', 17) + 'Отправить</button>' +
    '<button class="btn ghost sm" style="margin-top:9px" data-act="sheet-back">Закрыть</button>';
}

/* ============================================================
   РОУТЕР И РЕНДЕР
   ============================================================ */
const ROLES = [['parent', 'Родитель', 'profile'], ['escort', 'Сопровождающий', 'walk'],
  ['coord', 'Координатор', 'school'], ['duty', 'Дежурный', 'shield']];

const NAV = {
  parent: [['today', 'Сегодня', 'home'], ['routes', 'Маршруты', 'route'], ['profile', 'Профиль', 'profile']],
  escort: [['tasks', 'Задания', 'doc'], ['eprofile', 'Профиль', 'profile']],
  coord: [['school', 'Школа', 'school'], ['cand', 'Кандидаты', 'users']],
  duty: [['inbox', 'Инциденты', 'alarm'], ['trips', 'Поездки', 'route']],
};

const TABS = {
  today: V.today, routes: V.routes, profile: V.parentProfile,
  tasks: E.tasks, eprofile: E.profile,
  school: C.school, cand: C.cand,
  inbox: D.inbox, trips: D.trips,
};
const PAGES = { track: P.track, route: P.route, match: P.match, proof: P.proof, wizard: P.wizard, verify: P.verify, active: E.active };
const LIVE = ['today', 'track', 'active', 'inbox', 'trips'];

function currentKey() {
  return S.stack.length ? S.stack[S.stack.length - 1].name : S.tab[S.role];
}

function header() {
  const t = DB.trip;
  const lost = t && !t.done && t.frozen && Date.now() - t.fixAt > 20000;
  let chip;
  if (S.role === 'parent') {
    chip = lost
      ? '<span class="status-chip alert"><span class="live red"></span>сигнала нет</span>'
      : '<span class="status-chip"><span class="live"></span>' + (t && !t.done ? 'под присмотром' : 'всё спокойно') + '</span>';
  } else if (S.role === 'escort') {
    chip = '<span class="status-chip">' + (t && !t.done ? '<span class="live"></span>на маршруте' : 'свободна') + '</span>';
  } else if (S.role === 'coord') {
    chip = '<span class="status-chip">' + DB.school.name + '</span>';
  } else {
    chip = '<span class="status-chip dark"><span class="live"></span>смена на связи</span>';
  }
  return '<img class="logo" src="__LOGO__" alt="Заступник">' +
    '<div class="wordmark">ЗАСТУПНИК<small>ПроВожатый</small></div>' +
    '<span class="grow"></span>' + chip;
}

function navBar() {
  return NAV[S.role].map(([id, label, icon]) =>
    '<button data-act="tab" data-v="' + id + '"' + (S.tab[S.role] === id && !S.stack.length ? ' aria-current="page"' : '') + '>' +
    ic(icon, 22) + label + '</button>').join('');
}

/* ---------- нативная обвязка MAX ----------
   Шапку и кнопку «назад» рисует мессенджер, а не мы: держим их
   в согласии со стеком экранов и предупреждаем о потере мастера. */
function goBack() {
  if (S.sheet) { closeSheet(); return; }
  if (S.stack.length) { S.stack.pop(); render(); }
}

let chromeBack = false, chromeGuard = false;
function syncChrome(key) {
  const deep = !!S.sheet || S.stack.length > 0;
  if (deep !== chromeBack) { chromeBack = deep; deep ? maxBridge.back.show() : maxBridge.back.hide(); }
  const inWizard = key === 'wizard' && !!P.wizard.state;
  if (inWizard !== chromeGuard) { chromeGuard = inWizard; maxBridge.guardClosing(inWizard); }
}

function render(opts) {
  const keep = opts && opts.keep;
  const app = $('#app');
  app.classList.toggle('dark', S.role === 'duty');
  $('#hdr').innerHTML = header();
  const sc = $('#screen');
  const y = sc.scrollTop;
  const key = currentKey();
  sc.classList.toggle('anim', !keep);
  sc.innerHTML = S.stack.length ? PAGES[key](S.stack[S.stack.length - 1].p || {}) : TABS[key]();
  sc.scrollTop = keep ? y : 0;
  $('#nav').innerHTML = navBar();
  syncChrome(key);
  if (keep) return; // демо-панель перерисовываем только на действиях пользователя
  $('#stand-toggle').setAttribute('aria-expanded', String(S.stand));
  $('#stand-role').textContent = (ROLES.find((r) => r[0] === S.role) || [])[1] || '';
  $('#standbar').hidden = !S.stand;
  if (!S.stand) return; // свёрнутый стенд незачем наполнять
  $('#roles').innerHTML = ROLES.map(([id, label, icon]) =>
    '<button data-act="role" data-v="' + id + '" aria-pressed="' + (S.role === id) + '">' + ic(icon, 19) + label + '</button>').join('');
  const t = DB.trip;
  $('#scen').innerHTML =
    '<button data-act="scen-freeze">' + (t && t.frozen ? 'Вернуть сигнал' : 'Сценарий: пропал сигнал') + '</button>' +
    '<button data-act="scen-late">Сценарий: ребёнка не забрали</button>' +
    '<button data-act="scen-reset">Сбросить</button>';
}

/* ---------- действия ---------- */
const A = {
  noop() {},
  role(el) { S.role = el.dataset.v; S.stack = []; },
  tab(el) { S.stack = []; S.tab[S.role] = el.dataset.v; },
  push(el) { S.stack.push({ name: el.dataset.page, p: { r: el.dataset.r, d: el.dataset.d } }); },
  pop() { S.stack.pop(); },
  'sheet-back'() { closeSheet(); },
  toast(el) { toast(el.dataset.msg); },
  'go-track'() { S.role = 'parent'; S.stack = [{ name: 'track' }]; },
  match(el) { S.stack.push({ name: 'match', p: { r: el.dataset.r, d: el.dataset.d } }); },
  chat() { openSheet(chatSheet()); },

  /* ---------- уровни проверки ----------
     Каждое действие вызывает настоящий метод MAX и честно сообщает,
     что происходит вне мессенджера, — молча подмигивать успехом нельзя:
     на этих экранах обещание проверки и есть продукт. */
  'verify-phone'() {
    const p = maxBridge.requestPhone();
    if (!p) {
      toast('<b>Вне MAX номер не запросить.</b> В мессенджере здесь откроется нативное окно, а сервер сверит хеш ответа с токеном бота — это подтвердит, что номер тот же, что привязан к аккаунту.');
      return;
    }
    p.then((r) => {
      const m = meNow();
      m.trust.phone = 1;
      m.phone = r && r.phone || '';
      maxBridge.notify('success');
      toast('<b>Номер получен.</b> Подтверждённым он станет после сверки хеша на сервере — до этого показываем его как непроверенный.');
      render();
    }).catch(() => {
      toast('Без номера дальше нельзя: это единственный канал, по которому до вас дозвонится дежурный.');
      render();
    });
  },
  'verify-person'() {
    // ЕСИА — внешний браузер: OAuth не живёт внутри webview мессенджера.
    if (maxBridge.openLink('https://esia.gosuslugi.ru/')) {
      toast('Возвращайтесь в MAX после входа — уровень обновится сам.');
      return;
    }
    toast('<b>Вход через Госуслуги открывается во внешнем браузере</b> — ЕСИА не работает внутри webview. Подключение ЕСИА организации требует аттестации по требованиям ИБ, поэтому на пилоте личность подтверждает банковский ID или модератор «Заступника».');
  },
  'verify-crim'() {
    if (maxBridge.openLink('https://www.gosuslugi.ru/600103/1')) return;
    toast('<b>Справку о несудимости заказывает сам человек</b> на Госуслугах — она приходит подписанной МВД, и мы проверяем подпись. Срок до 30 дней: это и есть настоящая цена доверия, обойти её нечем.');
  },
  // Граница между продуктами: живая карта — в нативном «Заступнике».
  'open-native'() {
    if (maxBridge.openLink('https://zastupnik.app/trip/' + (DB.trip ? DB.trip.routeId : ''))) return;
    toast('<b>Живая карта — в приложении «Заступник».</b> Мини-апп в MAX показывает последнюю точку и статусы, но не ведёт трекинг: фоновая геопозиция в webview невозможна.');
  },
  'verify-local'() {
    toast('Координатору школы ушёл запрос. Он подтверждает не вашу добропорядочность, а факт: этот человек здесь учится или водит сюда ребёнка.');
  },
  'verify-live'() {
    const b = maxBridge.biometry.init();
    if (!b) {
      toast('<b>Биометрия доступна только в мобильном MAX.</b> Перед каждым выходом на маршрут приложение спросит отпечаток или лицо — так проверяется не документ, а то, что телефон в тех же руках.');
      return;
    }
    Promise.resolve(b).then(() => maxBridge.biometry.auth('Подтвердите, что это вы, перед выходом на маршрут'))
      .then(() => { meNow().trust.live = 1; maxBridge.notify('success'); toast('<b>Живость подтверждена.</b> Уровень держится одну смену — завтра спросим снова.'); render(); })
      .catch(() => { toast('Биометрия не подтверждена — выход на маршрут остаётся закрытым.'); render(); });
  },

  approve(el) {
    const c = DB.people[el.dataset.c];
    if (!trustOk(c)) {
      maxBridge.notify('error');
      toast('<b>' + c.name + ' не прошёл' + (c.id === 'a3' ? 'а' : '') + ' уровень «' + TRUST_BY[ESCORT_GATE].name + '».</b> Назначить нельзя — это не рекомендация платформы, а порог.');
      return;
    }
    const r = DB.routes.find((x) => x.id === el.dataset.r);
    r.cover[el.dataset.d] = c.id;
    if (DB.pending && DB.pending.id === c.id) DB.pending = null;
    DB.firstWalk = { who: c.name, when: 'пятница, 13:20' };
    S.stack.pop();
    maxBridge.haptic('medium');
    toast('<b>' + c.name + ' назначен' + (c.id === 'a3' ? 'а' : '') + '.</b> Первый маршрут вы проходите вместе — дальше решаете сами, доверять ли дальше.');
  },

  /* сопровождающий */
  advance() {
    const t = DB.trip;
    if (!t || t.done) return;
    t.stage = Math.min(6, t.stage + 1);
    t.log.push({ t: tclock(), a: 'Сопровождающий', b: STAGES[t.stage] });
    maxBridge.haptic('light');
    if (t.stage === 6) openSheet(handoverSheet());
  },
  'pick-recipient'(el) { DB.trip.recipient = el.dataset.v; openSheet(handoverSheet()); },
  photo() { photoInput.click(); },
  'confirm-handover'() {
    const t = DB.trip;
    if (!t.recipient || !t.photo) return;
    t.stage = 7;
    t.log.push({ t: tclock(), a: 'Сопровождающий', b: 'Передача подтверждена · ' + t.recipient + ' · фото приложено' });
    closeSheet();
    setTimeout(() => {
      t.stage = 8; t.done = true;
      t.log.push({ t: tclock(), a: 'Сервер', b: 'Поездка завершена · состояние подтверждено' });
      DB.delivered = { at: tclock(), recipient: t.recipient, escort: DB.people[t.escort].name, photo: t.photo, log: t.log };
      DB.upcoming = DB.upcoming.slice(1);
      maxBridge.notify('success');
      render();
      toast('<b>Миша дошёл ✓</b> Родителю ушло сообщение в MAX с временем и принимающим.');
    }, 1100);
    render();
    toast('<b>Передача подтверждена.</b> Завершение необратимо и однократно.');
  },
  'escort-sos'() { openSheet(sosSheet()); },
  'sos-pick'(el) {
    closeSheet();
    DB.incidents.unshift({
      id: 'I-32' + (DB.incidents.length + 1), kind: 'SOS сопровождающего · ' + el.dataset.v, level: 'sos', at: tclock(),
      body: 'Школа №1, поездка ' + DB.trip.id + ', ребёнок Миша. Сигнал от сопровождающего Алина Кузнецова.', state: 'open',
    });
    maxBridge.notify('error');
    toast('<b>Тревога отправлена — дежурный уведомлён.</b> Так пишем только когда дежурный есть и до него дошло.');
  },
  'parent-sos'() {
    DB.incidents.unshift({
      id: 'I-330', kind: 'SOS родителя на активной поездке', level: 'sos', at: tclock(),
      body: 'Поездка ' + DB.trip.id + '. Тревогу подняла Ольга Соколова.', state: 'open',
    });
    toast('<b>Тревога зафиксирована.</b> При угрозе жизни звоните 112 — мини-апп не заменяет экстренные службы.');
  },

  /* координатор */
  'coord-share'() {
    const text = 'ПроВожатый: безопасный путь в школу для ' + DB.child.cls + '. Подключиться — за три минуты в MAX.';
    const link = DEEPLINK + '?startapp=class_' + DB.child.code;
    if (maxBridge.share(text, link)) return;
    toast('<b>Ссылка готова к отправке в чат класса.</b> В MAX это откроет системный лист выбора чата.');
  },
  'confirm-student'(el) {
    C.confirmed = C.confirmed || {};
    C.confirmed[el.dataset.c] = true;
    // Подтверждение школы — это и есть уровень «свой в школе».
    const c = DB.people[el.dataset.c];
    if (c) c.trust.local = 1;
    toast('Факт обучения подтверждён — у кандидата появился уровень «' + TRUST_BY.local.name + '». Школа подтверждает только это: ответственности за поездку у неё нет.');
  },

  /* дежурный */
  'duty-ack'(el) {
    const i = DB.incidents.find((x) => x.id === el.dataset.i);
    if (i) i.state = 'ack';
    toast('Подтверждение дежурного останавливает часы, но не закрывает проблему.');
  },

  /* мастер маршрута */
  'wiz-next'() {
    const w = P.wizard.state;
    if (w.step < 5) { w.step++; return; }
    DB.routes.push({
      id: 'r3', title: (w.from.indexOf('Дом') === 0 ? 'Дом' : w.from) + ' → ' + w.to, child: w.child,
      from: w.from, to: w.to, time: w.time, dist: '0,9 км', walk: '11 мин',
      days: w.days.slice(), cover: {}, whitelist: w.wl.map((x) => ({ name: x.split(' · ')[0], role: x.split(' · ')[1], kind: 'принимает' })),
    });
    P.wizard.state = null;
    S.stack = [];
    S.tab.parent = 'routes';
    toast('<b>Маршрут создан.</b> Теперь подберите сопровождающего — без него поездки не начнутся.');
  },
  'wiz-back'() { P.wizard.state.step--; },
  'wiz-day'(el) {
    const w = P.wizard.state; const v = el.dataset.v;
    w.days = w.days.includes(v) ? w.days.filter((x) => x !== v) : w.days.concat(v);
  },
  'wiz-to'(el) { P.wizard.state.to = el.dataset.v; },
  'wiz-wl'(el) {
    const w = P.wizard.state; const v = el.dataset.v;
    w.wl = w.wl.includes(v) ? w.wl.filter((x) => x !== v) : w.wl.concat(v);
  },

  /* демо-сценарии */
  stand() { S.stand = !S.stand; },
  'scen-freeze'() {
    const t = DB.trip;
    if (!t || t.done) { toast('Поездка уже завершена — сбросьте демо, чтобы повторить сценарий.'); return; }
    t.frozen = !t.frozen;
    if (!t.frozen) { t.fixAt = Date.now(); toast('Сигнал восстановлен.'); }
    else toast('Приложение сопровождающего замолчало. Через 25 секунд сервер сам откроет инцидент дежурному.');
  },
  'scen-late'() {
    DB.incidents.unshift({
      id: 'I-32' + (DB.incidents.length + 5), kind: 'Ребёнка не забрали вовремя', level: 'warn', at: tclock(),
      body: 'Школа №1, маршрут «Школа №1 → Дом», ребёнок Миша. Сопровождающий на точке, ребёнка нет 6 минут.', state: 'open',
    });
    toast('Детектор сработал: инцидент у дежурного, родителю уйдёт уведомление.');
  },
  'scen-reset'() { location.reload(); },
};

/* ---------- ввод фото ---------- */
const photoInput = document.createElement('input');
photoInput.type = 'file';
photoInput.accept = 'image/*';
photoInput.setAttribute('capture', 'environment');
photoInput.style.display = 'none';
document.body.appendChild(photoInput);
photoInput.addEventListener('change', () => {
  const f = photoInput.files && photoInput.files[0];
  if (!f) return;
  DB.trip.photo = URL.createObjectURL(f);
  openSheet(handoverSheet());
});

/* ---------- события ----------
   Эти действия дают собственный тактильный отклик — общий «light» их бы забил. */
const OWN_HAPTIC = { 'sheet-back': 1, 'sos-pick': 1, approve: 1 };

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'sheet-back' && e.target.closest('[data-stop]') && el.classList.contains('sheet-back')) return;
  const fn = A[el.dataset.act];
  if (!fn) return;
  fn(el);
  if (!OWN_HAPTIC[el.dataset.act]) maxBridge.haptic('light');
  render();
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-in]');
  if (!el || !P.wizard.state) return;
  const k = el.dataset.in;
  if (k in P.wizard.state) P.wizard.state[k] = el.value;
});

/* ---------- серверный тик: движение и детекторы ---------- */
setInterval(() => {
  const t = DB.trip;
  if (t && !t.done) {
    if (!t.frozen) t.fixAt = Date.now();
    if (t.stage === 1) t.approach = Math.min(1, t.approach + 0.04);
    if (t.stage === 4) t.progress = Math.min(0.96, t.progress + 0.006);
    const age = (Date.now() - t.fixAt) / 1000;
    if (t.frozen && age > 25 && !DB.incidents.some((i) => i.kind.indexOf('Пропал сигнал') === 0)) {
      DB.incidents.unshift({
        id: 'I-319', kind: 'Пропал сигнал на активной поездке', level: 'sos', at: tclock(),
        body: 'Школа №1, поездка ' + t.id + ', ребёнок Миша. Приложение сопровождающего замолчало. Родитель видит честное «сигнал не поступает», а не старую метку.',
        state: 'open',
      });
      if (S.role !== 'duty') toast('<b>Дежурный «Заступника» открыл инцидент.</b> Сигнал сопровождающего не поступает.');
    }
  }
  if (!S.sheet && LIVE.indexOf(currentKey()) >= 0) render({ keep: true });
}, 1000);

/* ---------- старт ----------
   Вход по диплинку max.ru/<бот>?startapp=<payload>. Координатор шлёт
   такую ссылку в чат класса — это и есть канал раздачи. MAX разрешает
   в payload только латиницу, цифры, «_» и «-», до 512 символов,
   поэтому класс едет кодом, а не названием. */
(function applyStartParam() {
  const [kind, value] = maxBridge.startParam().split('_');
  if (kind === 'role' && NAV[value]) { S.role = value; return; }
  if (kind !== 'class' || !value) return;
  S.role = 'parent';
  S.tab.parent = 'routes';
  setTimeout(() => toast('<b>Приглашение класса принято.</b> Создайте маршрут ребёнка — дальше подбор пойдёт по вашему коридору.'), 400);
})();

maxBridge.back.onClick(goBack);
render();

</script>
